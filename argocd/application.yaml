apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudopshub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/cloudopshub-devops-platform.git
    targetRevision: main
    path: helm/cloudopshub
    helm:
      values: |
        image:
          repository: ghcr.io/YOUR_GITHUB_USERNAME/cloudopshub-devops-platform
          tag: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudopshub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
