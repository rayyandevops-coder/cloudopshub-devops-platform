apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudopshub.fullname" . }}
  labels:
    app: {{ include "cloudopshub.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ include "cloudopshub.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "cloudopshub.name" . }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: {{ .Values.config.environment | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: APP_VERSION
              value: {{ .Values.config.appVersion | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
{{ toYaml .Values.resources | indent 12 }}
