replicaCount: 2

image:
  repository: ghcr.io/rayyandevops-coder/cloudopshub-devops-platform
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: nginx
  host: cloudopshub.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  environment: production
  logLevel: INFO
  appVersion: "1.0.0"
