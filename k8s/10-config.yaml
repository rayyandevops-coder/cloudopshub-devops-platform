apiVersion: v1
kind: Secret
metadata:
  name: cloudpulse-db-secret
  namespace: cloudpulse
type: Opaque
stringData:
  POSTGRES_DB: cloudpulse
  POSTGRES_USER: cloudpulse
  POSTGRES_PASSWORD: change-this-local-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudpulse-config
  namespace: cloudpulse
data:
  DATABASE_URL: postgresql://cloudpulse:change-this-local-password@cloudpulse-postgres:5432/cloudpulse
  REDIS_URL: redis://cloudpulse-redis:6379/0
